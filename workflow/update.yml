name: Update position

on:
  schedule:
    # Once an hour. Each run then listens for 55 minutes, so coverage is nearly
    # continuous even when GitHub delays or drops a scheduled run.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      listen_minutes:
        description: "Minutes to listen for AIS (default 55)"
        required: false
        default: "55"

permissions:
  contents: write

concurrency:
  group: position
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install websockets

      - name: Fetch position and weather
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          LISTEN_SECONDS: ${{ github.event_name == 'schedule' && '3300' || format('{0}', inputs.listen_minutes || '55') }}
          CONTACT_UA: "sorlandet-tracker (github actions)"
        run: |
          # workflow_dispatch gives minutes, the schedule gives seconds already
          if [ "${{ github.event_name }}" != "schedule" ]; then
            export LISTEN_SECONDS=$(( ${LISTEN_SECONDS:-55} * 60 ))
          fi
          echo "Listening for $LISTEN_SECONDS seconds"
          python3 scripts/update.py

      - name: Save new data
        if: always()
        run: |
          git config user.name "sorlandet-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No changes in data/."
            exit 0
          fi
          git add data/
          git commit -m "Position $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Saved."
              exit 0
            fi
            echo "Push failed, attempt $attempt - retrying in 5 seconds."
            sleep 5
          done
          echo "Could not push, but the position will be fetched again next hour."
