name: Update position

# GitHub's scheduler never fired for this repository, so the run does not rely on it.
# Each run works for about five hours and then starts its successor, forming a chain
# that keeps going on its own. The hourly cron is kept only as a backstop in case the
# chain is ever broken and the scheduler happens to be working that day.

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours to keep listening (max 5.5)"
        required: false
        default: "5.5"
      chain:
        description: "Start the next run when this one ends"
        required: false
        default: "yes"

permissions:
  contents: write
  actions: write

concurrency:
  group: position
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install websockets

      - name: Listen, save, repeat
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
          LISTEN_SECONDS: "1740"
          CONTACT_UA: "sorlandet-tracker (github actions)"
        run: |
          git config user.name "sorlandet-bot"
          git config user.email "bot@users.noreply.github.com"

          save() {
            if [ -n "$(git status --porcelain data/)" ]; then
              git add data/
              git commit -m "$1 $(date -u +'%Y-%m-%d %H:%M UTC')"
              for attempt in 1 2 3; do
                git pull --rebase --autostash origin main && git push && break
                sleep 5
              done
            else
              echo "nothing new to save"
            fi
          }

          # A quick pass first. update.py spends its whole listening window before it
          # writes anything, so without this a restart shows no change for 29 minutes -
          # weather, route and forecast included, however fresh the code is. Twenty
          # seconds is enough to refresh everything that does not depend on hearing her.
          echo "::group::Quick first pass"
          LISTEN_SECONDS=20 python3 scripts/update.py || echo "quick pass failed, carrying on"
          save "Refresh"
          echo "::endgroup::"

          HOURS="${{ inputs.hours || '5.5' }}"
          ROUNDS=$(python3 -c "print(max(1, min(11, round(float('$HOURS') * 2))))")
          echo "Running $ROUNDS rounds of 29 minutes"

          for round in $(seq 1 "$ROUNDS"); do
            echo "::group::Round $round of $ROUNDS"
            python3 scripts/update.py || echo "round failed, carrying on"
            save "Position"
            echo "::endgroup::"
          done

      # Always, even if the listening step failed - a broken round must not break the chain.
      - name: Start the next run
        if: always()
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          CHAIN: ${{ inputs.chain || 'yes' }}
        run: |
          if [ "$CHAIN" != "yes" ]; then
            echo "Chaining switched off for this run."; exit 0
          fi
          if [ -z "$TOKEN" ]; then
            echo "No DISPATCH_TOKEN secret - the chain stops here."
            echo "Add one to make this run for ever; see README."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main","inputs":{"hours":"5.5","chain":"yes"}}')
          if [ "$code" = "204" ]; then
            echo "Next run requested - the chain continues."
          else
            echo "Could not start the next run (HTTP $code):"; cat /tmp/out.txt
            echo "The page will show that the updater has stopped."
          fi
